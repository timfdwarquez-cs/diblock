<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Division Block Blast</title>
<link rel="icon" type="image/png" href="diblock%20-%20icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1 class="brand"><img class="brand-logo" src="diblock%20-%20logo.png" alt="Diblock"></h1>
    <div class="stats"><div>Score<b id="score">0</b></div><div>Best<b id="best">0</b></div><div>Streak<b id="streak">0</b></div></div>
  </header>
  <nav class="themes" aria-label="Choose a theme">
    <button class="theme-button" type="button" data-theme="classic" aria-pressed="true">Classic</button>
    <button class="theme-button" type="button" data-theme="ribbon" aria-pressed="false">🎀 Ribbon</button>
    <button class="theme-button" type="button" data-theme="twilight" aria-pressed="false">🌙 Twilight</button>
  </nav>
  <div id="board"></div>
  <div id="msg">Tap a locked piece and solve its division to unlock it.</div>
  <div id="tray"></div>
</div>
<div id="ghost"></div>

<div class="modal" id="qm"><div class="box" id="qbox">
  <h2>Solve to unlock the piece</h2>
  <div class="ld"><span class="d" id="qd"></span><span class="n" id="qn"></span></div>
  <div class="ans">
    <label>Quotient<input id="aq" type="number" inputmode="numeric"></label>
    <label id="rl">Remainder<input id="ar" type="number" inputmode="numeric"></label>
  </div>
  <div id="qerr"></div>
  <div class="row"><button class="g" id="qc">Cancel</button><button id="qs">Check</button></div>
</div></div>

<div class="modal" id="over"><div class="box">
  <h2>Game over</h2>
  <div class="final-score" id="fs">0</div>
  <div class="game-over-copy">No more pieces fit on the board.</div>
  <div class="row"><button id="again">Play again</button></div>
</div></div>

<script src="script.js"></script>
</body>
</html>
